[package]
name = "colab-server"
edition.workspace = true
version.workspace = true
license.workspace = true

[lib]
name = "colab_server"

[[bin]]
name = "colab-server"
path = "src/main.rs"

[dependencies]
nb.workspace = true
kernel.workspace = true
kernel-local.workspace = true
colab.workspace = true
tooling.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
tokio.workspace = true
ts-rs.workspace = true
futures.workspace = true
base64 = "0.22"
rmcp = { version = "3.7.0", features = ["server", "macros", "transport-streamable-http-server"] }
axum = { version = "0.8.9", features = ["ws"] }
tokio-tungstenite = "0.28"
schemars = "1.2.3"
reqwest = "0.13.5"
log = "0.4.34"
fern = "0.7"
dirs = "6"
url = "2"
uuid.workspace = true
libc = "0.2"

[dev-dependencies]
tempfile = "3"
rmcp = { version = "3.7.0", features = ["client", "transport-streamable-http-client-reqwest"] }
