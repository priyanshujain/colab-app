[package]
name = "colab-app"
edition.workspace = true
version.workspace = true
license.workspace = true

[lib]
name = "colab_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dev-dependencies]
tempfile = "3"
dirs = "6"
rmcp = { version = "3.7.0", features = ["client", "transport-streamable-http-client-reqwest"] }
reqwest = "0.13.5"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
font-kit = "0.14"
tauri = { version = "2", features = [] }
nb.workspace = true
kernel.workspace = true
kernel-local.workspace = true
colab.workspace = true
tooling.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
tokio.workspace = true
ts-rs.workspace = true
futures.workspace = true
url = "2"
base64 = "0.22"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2.7.2"
tauri-plugin-clipboard-manager = "2.5.0"
rmcp = { version = "3.7.0", features = ["server", "macros", "transport-streamable-http-server"] }
axum = "0.8.9"
schemars = "1.2.3"
