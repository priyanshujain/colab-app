[package]
name = "colab-app"
edition.workspace = true
version.workspace = true
license.workspace = true

[lib]
name = "colab_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dev-dependencies]
tempfile = "3"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
font-kit = "0.14"
tauri = { version = "2", features = ["macos-private-api"] }
colab-server = { path = "../crates/server" }
colab.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
futures.workspace = true
tokio-tungstenite = "0.28"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2.7.2"
tauri-plugin-clipboard-manager = "2.5.0"
tauri-plugin-log = "2.10.1"
log = "0.4.34"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSData", "NSGeometry", "NSString"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSBezierPath", "NSButton", "NSColor", "NSControl", "NSEvent", "NSFont", "NSFontDescriptor", "NSGridView", "NSImage", "NSImageView", "NSLayoutAnchor", "NSLayoutConstraint", "NSMenu", "NSMenuItem", "NSResponder", "NSStackView", "NSStatusBar", "NSStatusBarButton", "NSStatusItem", "NSText", "NSTextField", "NSUserInterfaceLayout", "NSView"] }
