[workspace]
resolver = "3"
members = ["crates/*", "src-tauri"]

[workspace.package]
edition = "2024"
version = "0.1.5"
license = "Apache-2.0"

[workspace.dependencies]
nb = { path = "crates/nb" }
kernel = { path = "crates/kernel" }
kernel-local = { path = "crates/kernel-local" }
colab = { path = "crates/colab" }
tooling = { path = "crates/tooling" }
anyhow = "1"
thiserror = "2"
async-trait = "0.1"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
ts-rs = { version = "12", features = ["serde-json-impl", "uuid-impl", "chrono-impl"] }
